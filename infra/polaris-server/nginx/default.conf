# Polaris update feed. Every file under /updates/ needs a valid invite code in
# the X-Polaris-Invite header; without one the answer is 401 and nothing,
# not even the version list, is revealed.
map $http_x_polaris_invite $polaris_invite_ok {
    default 0;
    include /etc/nginx/polaris-invites.map;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /updates/ {
        if ($polaris_invite_ok = 0) {
            return 401;
        }
        alias /srv/updates/;
        autoindex off;
        # The latest*.yml files change every release; installers never do.
        location ~ \.yml$ {
            if ($polaris_invite_ok = 0) {
                return 401;
            }
            add_header Cache-Control "no-store" always;
        }
    }

    # Public download links to share (V 5.4.0): the installers only, never the
    # latest*.yml lists, blockmaps or a directory listing. Polaris-mac.dmg and
    # Polaris-windows.exe are symlinks the publish script points at the newest
    # version, so those two links never change.
    location ~ ^/download/(Polaris-(?:[0-9]+\.[0-9]+\.[0-9]+-(?:arm64\.dmg|x64\.exe)|mac\.dmg|windows\.exe))$ {
        alias /srv/updates/$1;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        return 404;
    }
}
