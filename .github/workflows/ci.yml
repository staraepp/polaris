# Polaris CI. Runs only commands verified locally on Node 24.13.1 (see AGENTS.md).
# Upstream's release, deploy, mobile and bot workflows are kept for reference in
# .github/upstream-workflows/ and do not run. Nothing here uses secrets.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Same setup action upstream uses. Node comes from .nvmrc, which must stay in
      # step with package.json `engines`. Also runs the install.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Format
        run: vp fmt --check

      - name: Lint
        run: vp lint --report-unused-disable-directives

      - name: Typecheck contracts
        run: vp run --filter @t3tools/contracts typecheck

      - name: Typecheck shared
        run: vp run --filter @t3tools/shared typecheck

      - name: Typecheck client-runtime
        run: vp run --filter @t3tools/client-runtime typecheck

      - name: Typecheck server
        run: vp run --filter t3 typecheck

      - name: Typecheck web
        run: vp run --filter @t3tools/web typecheck

      - name: Typecheck desktop
        run: vp run --filter @t3tools/desktop typecheck

      - name: Test contracts
        run: vp run --filter @t3tools/contracts test

      - name: Test shared
        run: vp run --filter @t3tools/shared test

      - name: Test client-runtime
        run: vp run --filter @t3tools/client-runtime test

      # The whole scripts suite is not run: one upstream test already fails on the
      # pristine snapshot (see AGENTS.md, Known failing).
      - name: Test Discord release workflow step
        run: vp test run scripts/notify-discord-release.test.ts
